# Article Analysis System v3 - Docker Compose 生产部署
# 适配已有基础设施（PostgreSQL/Redis/Milvus/Grobid 已独立运行）

services:
  # ========== 前端 Nginx（HTTP/HTTPS） ==========
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: scipdf-frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - certbot-webroot:/var/www/certbot
    depends_on:
      - backend
    networks:
      - scipdf-network
    restart: unless-stopped

  # ========== 后端 FastAPI ==========
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: scipdf-backend
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
    volumes:
      - backend-data:/app/data
      - backend-logs:/app/logs
      - ./stanza_resources_v112:/app/stanza_resources:ro
      - ./scipdf:/app/scipdf:ro
    networks:
      - scipdf-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

  # ========== Task Worker（异步任务引擎） ==========
  task-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: scipdf-task-worker
    command: python backend/worker.py
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
    volumes:
      - backend-data:/app/data
      - backend-logs:/app/logs
      - ./stanza_resources_v112:/app/stanza_resources:ro
      - ./scipdf:/app/scipdf:ro
    depends_on:
      - backend
    networks:
      - scipdf-network
    restart: unless-stopped

  # ========== Certbot（按需运行，不随 docker compose up 启动） ==========
  # 用法：docker compose run --rm certbot certonly --webroot -w /var/www/certbot -d yourdomain.com
  certbot:
    image: certbot/certbot:latest
    profiles: ["certbot"]
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - certbot-webroot:/var/www/certbot
    entrypoint: certbot

# ========== 网络 ==========
networks:
  scipdf-network:
    driver: bridge
    # 如需与已有容器互联，取消注释下面的 external 并指定名称
    # external: true
    # name: existing-network-name

# ========== 数据卷 ==========
volumes:
  backend-data:
  backend-logs:
  certbot-etc:
  certbot-var:
  certbot-webroot:
