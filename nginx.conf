# Article Analysis System v3 - Nginx 主配置
# 入口脚本动态生成 http_server.conf 和 https_server.conf

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    # Gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    # 后端服务
    upstream backend {
        server backend:8000;
    }

    # 速率限制
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

    # HTTP 服务器（由 entrypoint 动态生成）
    include /etc/nginx/conf.d/http_server.conf;

    # HTTPS 服务器（由 entrypoint 动态生成，无证书时为空）
    include /etc/nginx/conf.d/https_server.conf;
}
